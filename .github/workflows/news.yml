name: Check Eagles & NFL news

on:
  schedule:
    - cron: '*/5 * * * *'   # a new job every 5 minutes; each one re-checks every minute
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  test:
    # Does nothing until the repo is public, so a private repo never burns its free minutes.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs

  crawl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Check news and scores every minute, send alerts
        run: node scripts/fetch-news.mjs
        env:
          RUN_SECONDS: ${{ vars.RUN_SECONDS || '240' }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS || '60' }}
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_LEAGUE: ${{ vars.ALERT_LEAGUE }}
          GAME_ALERTS: ${{ vars.GAME_ALERTS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
