name: Crawl NFL news

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub sometimes runs it a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crawl-news
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs

  crawl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Crawl feeds and send alerts
        run: node scripts/fetch-news.mjs
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TEAMS: ${{ vars.ALERT_TEAMS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
